<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slacker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 18 12"><path d="M1.2 6.4l3 3L10.2 2"/><path d="M7.2 6.4l3 3L16.2 2"/></svg>
        </div>
        <div class="brand-text">
          <h1>Slacker</h1>
          <p>Read receipts for Slack</p>
        </div>
      </div>
      <div id="live" class="status" aria-live="polite">
        <span id="connection-dot" class="status-dot"></span>
        <span id="live-label">Offline</span>
      </div>
    </header>

    <div class="stats" aria-label="Summary">
      <div class="stat">
        <div class="stat-label">Sent</div>
        <div class="stat-value" id="count-delivered">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Seen</div>
        <div class="stat-value is-seen" id="count-seen">0</div>
      </div>
    </div>

    <section class="section">
      <div class="section-head">
        <h2>Messages</h2>
        <button type="button" class="link-btn" id="clear-btn">Clear all</button>
      </div>
      <div class="list" id="receipts-list"></div>
    </section>

    <details class="settings">
      <summary class="settings-toggle">Connection settings</summary>
      <div class="settings-body">
        <label class="field-label" for="worker-url">Worker URL</label>
        <div class="field-row">
          <input id="worker-url" type="url" spellcheck="false" placeholder="https://slacker.tzgold.workers.dev" />
          <button type="button" class="btn" id="save-btn">Save</button>
        </div>
        <div class="field-hint" id="saved-msg"></div>
      </div>
    </details>

    <footer class="footer">
      <span id="stats">No activity yet</span>
      <span>v1.2</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
