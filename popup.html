<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slacker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1d1c1d;
      background: #fff;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #e8e8e8;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.2px;
    }
    .header .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ccc;
      margin-left: auto;
      transition: background .3s;
    }
    .header .dot.connected { background: #4CAF50; }

    /* ── Settings ── */
    .settings {
      padding: 12px 16px;
      border-bottom: 1px solid #e8e8e8;
    }
    .settings label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #616061;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 5px;
    }
    .input-row {
      display: flex;
      gap: 6px;
    }
    .input-row input {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
      transition: border-color .15s;
    }
    .input-row input:focus { border-color: #4A154B; }
    .btn {
      padding: 6px 10px;
      background: #4A154B;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn:hover { background: #611f69; }
    .btn.danger { background: #e01e5a; }
    .btn.danger:hover { background: #c01246; }
    .saved-msg {
      font-size: 11px;
      color: #4CAF50;
      margin-top: 4px;
      height: 14px;
      transition: opacity .3s;
    }

    /* ── Receipts list ── */
    .receipts-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 6px;
    }
    .receipts-header span {
      font-size: 11px;
      font-weight: 600;
      color: #616061;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .receipts-header .clear-btn {
      font-size: 11px;
      color: #e01e5a;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-weight: 600;
    }

    .receipts-list {
      max-height: 260px;
      overflow-y: auto;
    }
    .receipt-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 16px;
      border-bottom: 1px solid #f5f5f5;
    }
    .receipt-item:last-child { border-bottom: none; }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.seen      { background: #4CAF50; }
    .status-dot.delivered { background: #aaa; }

    .receipt-info { flex: 1; min-width: 0; }
    .receipt-id {
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .receipt-status {
      font-size: 12px;
      font-weight: 600;
      color: #1d1c1d;
    }
    .receipt-time {
      font-size: 11px;
      color: #888;
      white-space: nowrap;
    }

    .empty {
      padding: 24px 16px;
      text-align: center;
      color: #888;
      font-size: 12px;
    }

    /* ── Footer ── */
    .footer {
      padding: 8px 16px;
      border-top: 1px solid #e8e8e8;
      font-size: 11px;
      color: #aaa;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Slacker</h1>
    <span id="connection-dot" class="dot"></span>
  </div>

  <div class="settings">
    <label>Cloudflare Worker URL</label>
    <div class="input-row">
      <input id="worker-url" type="url" placeholder="https://your-worker.workers.dev" />
      <button class="btn" id="save-btn">Save</button>
    </div>
    <div class="saved-msg" id="saved-msg"></div>
  </div>

  <div class="receipts-header">
    <span>Recent Receipts</span>
    <button class="clear-btn" id="clear-btn">Clear all</button>
  </div>

  <div class="receipts-list" id="receipts-list">
    <div class="empty">No messages tracked yet.<br>Send a Slack message to start.</div>
  </div>

  <div class="footer">
    <span id="stats"></span>
    <span>Slacker v1.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
