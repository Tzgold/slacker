<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slacker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <img class="logo" src="icons/icon48.png" width="28" height="28" alt="" />
        <div class="brand-text">
          <h1>Slacker</h1>
          <p>Read receipts for Slack</p>
        </div>
      </div>
      <div id="live" class="status" aria-live="polite">
        <span id="connection-dot" class="status-dot"></span>
        <span id="live-label">Offline</span>
      </div>
    </header>

    <div class="power-row">
      <div class="power-text">
        <strong id="power-label">Slacker is on</strong>
        <span id="power-hint">Tracking sends and Seen pings</span>
      </div>
      <label class="switch" title="Pause Slacker">
        <input type="checkbox" id="power-toggle" checked />
        <span class="switch-ui" aria-hidden="true"></span>
        <span class="sr-only">Slacker on/off</span>
      </label>
    </div>

    <p class="tip">One check = sent · Two = they opened it with Slacker</p>

    <div class="stats" aria-label="Summary">
      <div class="stat">
        <div class="stat-label">Sent</div>
        <div class="stat-value" id="count-delivered">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Seen</div>
        <div class="stat-value is-seen" id="count-seen">0</div>
      </div>
    </div>

    <section class="section">
      <div class="section-head">
        <h2>Messages</h2>
        <div class="section-actions">
          <button type="button" class="link-btn" id="poll-btn">Check now</button>
          <button type="button" class="link-btn danger" id="clear-btn">Clear all</button>
        </div>
      </div>
      <div class="list" id="receipts-list"></div>
    </section>

    <footer class="footer">
      <span id="stats">No activity yet</span>
      <span>v1.3.8</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
